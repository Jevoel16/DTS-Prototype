# =============================================================================
# DTS Prototype — NGINX site template (Linux + Windows)
# Managed by scripts/dev.php and scripts/prod.php — edit this file, never the
# installed copy. Placeholders replaced at startup (see scripts/server-lib.php):
#   __PROJECT_ROOT__  → absolute path to the project (forward slashes)
#   __LAN_IP__        → detected LAN IP of this machine
#   __FASTCGI_PASS__  → Linux:   unix:/run/php/phpX.Y-fpm.sock (PHP-FPM)
#                       Windows: 127.0.0.1:9123               (php-cgi.exe)
#   __SSL_CERT__ / __SSL_KEY__ → Linux: /etc/ssl/...  Windows: storage/ssl/...
#   __LOG_DIR__       → Linux: /var/log/nginx        Windows: storage/logs
# On Windows this server block is wrapped in a generated nginx.conf
# (storage/nginx/nginx.conf); on Linux it is installed into sites-available.
# =============================================================================
# Coarse per-IP request limit for PHP (the app adds finer per-route limits).
# http-level directive: this file is included inside http {} on both platforms.
limit_req_zone $binary_remote_addr zone=dts_req_limit:10m rate=20r/s;

server {
    listen 8000 ssl;

    # Behind cloudflared (connecting from this host), use the visitor's real IP
    # for logs, limit_req and PHP's REMOTE_ADDR. Only trusted from localhost.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    # Accept requests to localhost, the LAN IP, or any other hostname.
    # _ is a catch-all; the explicit entries improve SSL SNI matching.
    server_name localhost __LAN_IP__ _;

    root "__PROJECT_ROOT__/public";

    # SSL Configuration (cert is auto-generated by dev.php/prod.php with
    # SANs for localhost + current LAN IP so browsers show the bypass prompt)
    ssl_certificate     "__SSL_CERT__";
    ssl_certificate_key "__SSL_KEY__";
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log "__LOG_DIR__/dts_access.log";
    error_log  "__LOG_DIR__/dts_error.log";

    index index.php index.html;
    client_max_body_size 20M;

    # Don't advertise the nginx version
    server_tokens off;

    # Security headers (repeated in the static-asset location, since a location-level
    # add_header replaces the server-level ones). Scripts must come from public/js: views
    # contain no inline JavaScript or on* handlers. style-src still allows inline styles
    # (Tailwind views use style="" attributes and the QR scanner library injects styles).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Compress text responses (HTML pages, Tailwind CSS, Chart.js, JSON APIs)
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Static assets: served directly by nginx and cached by browsers
    location ~ ^/(css|js|fonts|images)/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Inline equivalent of Debian's snippets/fastcgi-php.conf so the same
        # template works with nginx for Windows.
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info; # try_files below resets $fastcgi_path_info
        try_files $fastcgi_script_name =404;
        include fastcgi_params;            # also sets HTTPS for PHP's $_SERVER
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $path_info;
        fastcgi_index index.php;
        fastcgi_pass  __FASTCGI_PASS__;
        fastcgi_hide_header X-Powered-By;

        limit_req zone=dts_req_limit burst=60 nodelay;
        limit_req_status 429;

        # XLSX reports and DomPDF tracking forms can take a while
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
