# =============================================================================
# DTS Prototype — NGINX site template
# Managed by scripts/dev.php and scripts/prod.php — do not edit the installed
# copy at /etc/nginx/sites-available/dts-prototype; edit this file instead.
# Placeholders replaced at startup:
#   __PROJECT_ROOT__  → absolute path to the project
#   __PHP_VERSION__   → detected PHP version (e.g. 8.5)
#   __LAN_IP__        → detected LAN IP of this machine
# =============================================================================
server {
    listen 8000 ssl;
    # Accept requests to localhost, the LAN IP, or any other hostname.
    # _ is a catch-all; the explicit entries improve SSL SNI matching.
    server_name localhost __LAN_IP__ _;

    root "__PROJECT_ROOT__/public";

    # SSL Configuration (cert is auto-generated by dev.php/prod.php with
    # SANs for localhost + current LAN IP so browsers show the bypass prompt)
    ssl_certificate     /etc/ssl/certs/dts_prototype.crt;
    ssl_certificate_key /etc/ssl/private/dts_prototype.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/dts_access.log;
    error_log  /var/log/nginx/dts_error.log;

    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20M;
}